[metadata]
format.version = "1.1"

[versions]
awaitility = "4.2.2"
edc = "1.0.0-RC4"
okhttp-mockwebserver = "5.5.1"
restAssured = "6.2.0"
rsApi = "4.0.0"
testcontainers = "1.21.4"

[libraries]
